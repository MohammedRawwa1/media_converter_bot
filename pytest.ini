[pytest]
# A bare `pytest` collects the broker-free unit suite and nothing else, which is
# also what CI runs (`pytest tests/ -q`). `scripts/` holds live diagnostics - they
# read real credentials and talk to Telegram/S3 - so they are run on purpose
# (`python scripts/<name>.py`), never swept up by a test run.
testpaths = tests
filterwarnings =
    ignore:'cgi' is deprecated:DeprecationWarning:httpx\._models
    ignore:There is no current event loop:DeprecationWarning:pyrogram\.sync
