# Lint & Compile CI
# Runs on every push (all branches) and pull request.
# Performs: ruff linting, ruff format check, Python syntax/py_compile checks.
# Lightweight — only needs stdlib for py_compile, no runtime deps.

name: Lint & Compile

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: "Ruff lint + py_compile"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v4
        id: ruff_lint
        continue-on-error: true
        with:
          args: check . --config ruff.toml --output-format github

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v4
        id: ruff_format
        continue-on-error: true
        with:
          args: format . --config ruff.toml --check --output-format github

      - name: Run py_compile syntax check (single-pass)
        id: pycompile
        shell: bash
        run: |
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path './.venv/*' \
            -not -path './venv/*' \
            -not -path './env/*' \
            -not -path './__pycache__/*' \
            -not -path './.eggs/*' \
            -not -path './node_modules/*' \
            -not -path './.mypy_cache/*' \
            -not -path './.pytest_cache/*' \
            -not -path './.ruff_cache/*' \
            -print0 | python -c "
          import ast
          import os
          import sys

          # Ensure UTF-8 output on any runner (avoids cp1252 UnicodeEncodeError for the
          # emoji in the success line on Windows-local runs).
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          issues = []
          for line in sys.stdin.buffer.read().split(b'\0'):
              if not line:
                  continue
              fpath = line.decode()
              try:
                  ast.parse(open(fpath, encoding='utf-8', errors='replace').read())
              except SyntaxError as e:
                  rel = os.path.relpath(fpath)
                  print(f'::error file={rel}::SyntaxError: {e}')
                  issues.append(rel)

          if issues:
              n = len(issues)
              print(f'::error::py_compile: {n} file(s) have syntax errors:')
              for f in issues:
                  print(f'  - {f}')
              sys.exit(1)
          else:
              print('\u2705 py_compile: all files syntactically valid')
          "

      - name: Fail if lint or format failed
        if: steps.ruff_lint.outcome == 'failure' || steps.ruff_format.outcome == 'failure'
        run: exit 1

      - name: Summary
        if: always()
        run: |
          echo "========== LINT & COMPILE SUMMARY =========="
          echo "  Ruff lint:       ${{ steps.ruff_lint.outcome == 'success' && '✅ passed' || '❌ failed' }}"
          echo "  Ruff format:    ${{ steps.ruff_format.outcome == 'success' && '✅ passed' || '❌ failed' }}"
          echo "  py_compile:     ${{ steps.pycompile.outcome == 'success' && '✅ passed' || '❌ syntax errors' }}"
          echo "============================================"
