name: Lint & Compile

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff lint + py_compile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        id: ruff_lint
        continue-on-error: true
        run: |
          ruff check . --config ruff.toml --output-format=github

      - name: Check Ruff formatting
        id: ruff_format
        continue-on-error: true
        run: |
          ruff format . --config ruff.toml --check

      - name: Run Python syntax check
        id: pycompile
        shell: bash
        run: |
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -not -path "./env/*" \
            -not -path "./__pycache__/*" \
            -not -path "./.eggs/*" \
            -not -path "./node_modules/*" \
            -not -path "./.mypy_cache/*" \
            -not -path "./.pytest_cache/*" \
            -not -path "./.ruff_cache/*" \
            -print0 | python -c "
          import ast
          import os
          import sys

          sys.stdout.reconfigure(encoding='utf-8', errors='replace')

          issues = []

          for item in sys.stdin.buffer.read().split(b'\0'):
              if not item:
                  continue

              path = item.decode()

              try:
                  with open(path, encoding='utf-8', errors='replace') as f:
                      ast.parse(f.read(), filename=path)
              except SyntaxError as e:
                  rel = os.path.relpath(path)
                  print(f'::error file={rel}::SyntaxError: {e}')
                  issues.append(rel)

          if issues:
              print(f'::error::{len(issues)} Python file(s) contain syntax errors.')
              sys.exit(1)

          print('✅ All Python files passed syntax checks.')
          "

      - name: Fail if Ruff failed
        if: steps.ruff_lint.outcome == 'failure' || steps.ruff_format.outcome == 'failure'
        run: exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "========== LINT & COMPILE SUMMARY =========="

          if [ "${{ steps.ruff_lint.outcome }}" = "success" ]; then
            echo "Ruff lint:      ✅ passed"
          else
            echo "Ruff lint:      ❌ failed"
          fi

          if [ "${{ steps.ruff_format.outcome }}" = "success" ]; then
            echo "Ruff format:    ✅ passed"
          else
            echo "Ruff format:    ❌ failed"
          fi

          if [ "${{ steps.pycompile.outcome }}" = "success" ]; then
            echo "py_compile:     ✅ passed"
          else
            echo "py_compile:     ❌ syntax errors"
          fi

          echo "============================================"
          