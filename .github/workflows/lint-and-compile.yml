name: Lint & Compile

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Pinned exactly on purpose: `ruff format` output changes between releases,
  # so an unpinned install reds this job on a commit that was clean when it
  # was written. Keep in sync with requirements-dev.txt.
  RUFF_VERSION: "0.16.8"

jobs:
  lint:
    name: Ruff lint + py_compile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}"
          # Record the exact version in the log: a format regression is almost
          # always a version skew, and this is the first thing you would check.
          ruff --version

      - name: Run Ruff lint, Ruff format and the syntax check
        # The checks themselves live in scripts/check_lint.py so this job and a
        # pre-push run cannot disagree about what "clean" means. All three run even
        # when one of them fails, the script prints the summary that this job used
        # to assemble from step outcomes, and its exit code fails the step. Run it
        # locally the same way this step does:
        #   python scripts/check_lint.py
        run: python scripts/check_lint.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements-dev.txt adds pytest and pytest-asyncio: the async tests
          # are marked with @pytest.mark.asyncio, which pytest alone does not run.
          pip install -r requirements-dev.txt

      - name: Run tests
        # No brokers or databases are required: the event-bus tests either use
        # pure helpers or inject a fake producer, and the existing tests use
        # fakes for the session/db layer. Anything needing a live RabbitMQ or
        # Kafka belongs in scripts/check_eventbus.py, not here.
        run: pytest tests/ -q
          