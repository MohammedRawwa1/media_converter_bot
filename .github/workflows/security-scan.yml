name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Only the fallback install below needs this: the job normally gets ruff from
  # requirements-dev.txt, which pins the same version (ruff's report format
  # changes between releases). Keep the two in sync.
  RUFF_VERSION: "0.16.8"

jobs:
  security-scan:
    name: Bandit + Ruff + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install \
              bandit \
              pip-audit \
              "ruff==${RUFF_VERSION}"
          fi

      - name: Run Bandit security scan
        id: bandit
        shell: bash
        # The gate itself lives in scripts/check_bandit.py so this job and a
        # pre-push run cannot disagree about what "clean" means. It reads .bandit
        # through `--ini`, fails on HIGH findings only, and refuses to pass when
        # the config did not parse (which silently drops every skip). Run it
        # locally the same way this step does:
        #   python scripts/check_bandit.py
        run: python scripts/check_bandit.py --output bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Run pip-audit
        id: pipaudit
        continue-on-error: true
        shell: bash
        run: |
          pip-audit \
            --requirement requirements.txt \
            --desc | tee pip-audit-output.txt

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          ruff check . \
            --config ruff.toml \
            --output-format=github

      - name: Check for OWASP leak patterns
        continue-on-error: true
        shell: bash
        run: |
          patterns=(
            "exc.__class__.__name__"
            "allow_redirects=True"
          )

          found=0

          for pattern in "${patterns[@]}"; do
            matches=$(grep -RIn \
              --include="*.py" \
              --exclude-dir=.git \
              --exclude-dir=.venv \
              --exclude-dir=venv \
              --exclude-dir=env \
              --exclude-dir=__pycache__ \
              --exclude-dir=.ruff_cache \
              "$pattern" . || true)

            if [ -n "$matches" ]; then
              echo "::warning::Found pattern: $pattern"
              echo "$matches"
              found=$((found + 1))
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "✅ No OWASP leak patterns found."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "========== SECURITY SCAN SUMMARY =========="

          if [ "${{ steps.bandit.outcome }}" = "success" ]; then
            echo "Bandit:         ✅ passed"
          else
            echo "Bandit:         ❌ findings or failed"
          fi

          if [ "${{ steps.pipaudit.outcome }}" = "success" ]; then
            echo "pip-audit:      ✅ passed"
          else
            echo "pip-audit:      ⚠ vulnerabilities found"
          fi

          if [ "${{ steps.ruff.outcome }}" = "success" ]; then
            echo "Ruff:           ✅ passed"
          else
            echo "Ruff:           ❌ issues found"
          fi

          echo "Leak patterns:  ✅ checked"
          echo "==========================================="

  mediabot-audit:
    name: Tailored scanner (rules + CVE ingestion)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run media_conversion_bot tailored scanner
        id: mediabot
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python security/scan_mediabot.py --quiet
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "✅ mediabot scanner: clean" ;;
            2) echo "::error::mediabot scanner: confirmed CRITICAL/HIGH findings — see the report artifact" ;;
            3) echo "::warning::mediabot scanner: candidates only — needs manual adjudication" ;;
            *) echo "::error::mediabot scanner failed to run (exit $code)" ;;
          esac
          exit 0

      - name: Coverage summary
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("security/reports/mediabot-audit.json")
          if not p.is_file():
              print("::warning::no audit report produced")
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          sev = d.get("by_severity", {})
          kb = d.get("cve_kb", {})
          conf = d.get("by_verdict", {}).get("CONFIRMED", 0)
          cand = d.get("by_verdict", {}).get("CANDIDATE", 0)
          drift = [r["id"] for r in d.get("coverage", []) if r.get("status") == "catalog-drift"]
          print("=== mediabot audit ===")
          print(f"score: {d.get('score')}/100  findings: {len(d.get('findings', []))} "
                f"(confirmed {conf} / candidates {cand})")
          print(f"severity: " + ", ".join(f"{k}={v}" for k, v in sev.items()))
          print(f"deps resolved: {kb.get('dependency_count', 0)}  advisories: {kb.get('vulnerability_count', 0)}")
          print(f"catalog entries: {len(d.get('coverage', []))}  drift: {drift or 'none'}")
          if drift:
              print(f"::warning::skill catalog references unknown rules: {drift}")
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mediabot-security-audit
          path: |
            security/reports/mediabot-audit.json
            security/reports/MEDIABOT_SECURITY_AUDIT.md
            security/reports/mediabot-audit.sarif
            security/reports/cve-kb.json
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
        with:
          sarif_file: security/reports/mediabot-audit.sarif
          category: mediabot-rules

  lock-check:
    name: Dependency lock is in sync and hash-verified
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: requirements.lock matches requirements.txt
        shell: bash
        run: |
          # Same resolution target as the image (Dockerfile base: linux/amd64,
          # Python 3.12). If this command ever changes, update the lock header too.
          #
          # --upgrade is what makes this a *fresh* resolution. Without it uv
          # prefers the versions already in an existing output file, so the
          # committed lock silently went stale: re-running the documented
          # command in place kept multidict 6.8.0 while this check (writing to a
          # path that does not exist yet) resolved 6.9.0 and failed. Passing it
          # here and in the header keeps the two commands identical.
          uv pip compile requirements.txt \
            --generate-hashes \
            --upgrade \
            --python-version 3.12 \
            --python-platform x86_64-unknown-linux-gnu \
            --output-file /tmp/regenerated.lock

          # uv echoes the output path in its header comment, so compare content
          # and ignore comments, otherwise every run would look out of sync.
          if ! diff <(grep -v '^[[:space:]]*#' requirements.lock) \
                    <(grep -v '^[[:space:]]*#' /tmp/regenerated.lock); then
            echo "::error::requirements.lock is out of sync with requirements.txt — regenerate it with the command in its header."
            exit 1
          fi

          echo "✅ requirements.lock is in sync."

      - name: Install from the lock with hashes enforced
        shell: bash
        run: |
          # The decisive check: pip refuses in --require-hashes mode if any
          # requirement lacks a hash, and it verifies every downloaded wheel
          # against the lock. This runs on the same platform the image does.
          python -m pip install --require-hashes -r requirements.lock
          echo "✅ every dependency installed hash-verified."

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6  # v3.97.5
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      - name: Report TruffleHog results
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trufflehog.outcome }}" = "success" ]; then
            echo "✅ No verified secrets detected."
          else
            echo "::warning::TruffleHog detected verified secrets."
            echo "Review the workflow logs and rotate any exposed credentials immediately."
          fi
          