name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  security-scan:
    name: Bandit + Ruff + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install \
              bandit \
              pip-audit \
              ruff
          fi

      - name: Run Bandit security scan
        id: bandit
        shell: bash
        run: |
          BANDIT_ARGS=""

          if [ -f .bandit ]; then
            BANDIT_ARGS="-c .bandit"
          fi

          bandit \
            $BANDIT_ARGS \
            -r . \
            -f json \
            -o bandit-report.json || true

          if [ ! -f bandit-report.json ]; then
            echo "::error::Bandit did not produce a report."
            exit 1
          fi

          python <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as f:
              report = json.load(f)

          findings = report.get("results", [])

          if not findings:
              print("✅ Bandit: no findings")
              sys.exit(0)

          high = 0
          medium = 0
          low = 0

          for issue in findings:
              sev = issue["issue_severity"]

              if sev == "HIGH":
                  high += 1
              elif sev == "MEDIUM":
                  medium += 1
              else:
                  low += 1

              print(
                  f'[{sev}] '
                  f'{issue["test_id"]}: '
                  f'{issue["filename"]}:'
                  f'{issue["line_number"]} - '
                  f'{issue["issue_text"]}'
              )

          print(
              f"::warning::Bandit found "
              f"{len(findings)} issue(s): "
              f"{high} HIGH, {medium} MEDIUM, {low} LOW"
          )

          if high:
              print("::error::High-severity Bandit findings detected.")
              sys.exit(1)
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Run pip-audit
        id: pipaudit
        continue-on-error: true
        shell: bash
        run: |
          pip-audit \
            --requirement requirements.txt \
            --desc | tee pip-audit-output.txt

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          ruff check . \
            --config ruff.toml \
            --output-format=github

      - name: Check for OWASP leak patterns
        continue-on-error: true
        shell: bash
        run: |
          patterns=(
            "exc.__class__.__name__"
            "allow_redirects=True"
          )

          found=0

          for pattern in "${patterns[@]}"; do
            matches=$(grep -RIn \
              --include="*.py" \
              --exclude-dir=.git \
              --exclude-dir=.venv \
              --exclude-dir=venv \
              --exclude-dir=env \
              --exclude-dir=__pycache__ \
              --exclude-dir=.ruff_cache \
              "$pattern" . || true)

            if [ -n "$matches" ]; then
              echo "::warning::Found pattern: $pattern"
              echo "$matches"
              found=$((found + 1))
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "✅ No OWASP leak patterns found."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "========== SECURITY SCAN SUMMARY =========="

          if [ "${{ steps.bandit.outcome }}" = "success" ]; then
            echo "Bandit:         ✅ passed"
          else
            echo "Bandit:         ❌ findings or failed"
          fi

          if [ "${{ steps.pipaudit.outcome }}" = "success" ]; then
            echo "pip-audit:      ✅ passed"
          else
            echo "pip-audit:      ⚠ vulnerabilities found"
          fi

          if [ "${{ steps.ruff.outcome }}" = "success" ]; then
            echo "Ruff:           ✅ passed"
          else
            echo "Ruff:           ❌ issues found"
          fi

          echo "Leak patterns:  ✅ checked"
          echo "==========================================="

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      - name: Report TruffleHog results
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trufflehog.outcome }}" = "success" ]; then
            echo "✅ No verified secrets detected."
          else
            echo "::warning::TruffleHog detected verified secrets."
            echo "Review the workflow logs and rotate any exposed credentials immediately."
          fi
          