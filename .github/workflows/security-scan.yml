name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  security-scan:
    name: Bandit + Ruff + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install \
              bandit \
              pip-audit \
              ruff
          fi

      - name: Run Bandit security scan
        id: bandit
        shell: bash
        run: |
          BANDIT_ARGS=""

          # `--ini` points at the [bandit] section (skips/exclude). `-c/--configfile`
          # is a different thing entirely: the YAML plugin profile, which `.bandit`
          # is not — passing it there makes bandit fail to parse the file and emit
          # no report at all.
          if [ -f .bandit ]; then
            BANDIT_ARGS="--ini .bandit"
          fi

          bandit \
            $BANDIT_ARGS \
            -r . \
            -f json \
            -o bandit-report.json || true

          if [ ! -f bandit-report.json ]; then
            echo "::error::Bandit did not produce a report."
            exit 1
          fi

          python <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as f:
              report = json.load(f)

          findings = report.get("results", [])

          if not findings:
              print("✅ Bandit: no findings")
              sys.exit(0)

          high = 0
          medium = 0
          low = 0

          for issue in findings:
              sev = issue["issue_severity"]

              if sev == "HIGH":
                  high += 1
              elif sev == "MEDIUM":
                  medium += 1
              else:
                  low += 1

              print(
                  f'[{sev}] '
                  f'{issue["test_id"]}: '
                  f'{issue["filename"]}:'
                  f'{issue["line_number"]} - '
                  f'{issue["issue_text"]}'
              )

          print(
              f"::warning::Bandit found "
              f"{len(findings)} issue(s): "
              f"{high} HIGH, {medium} MEDIUM, {low} LOW"
          )

          if high:
              print("::error::High-severity Bandit findings detected.")
              sys.exit(1)
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: Run pip-audit
        id: pipaudit
        continue-on-error: true
        shell: bash
        run: |
          pip-audit \
            --requirement requirements.txt \
            --desc | tee pip-audit-output.txt

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          ruff check . \
            --config ruff.toml \
            --output-format=github

      - name: Check for OWASP leak patterns
        continue-on-error: true
        shell: bash
        run: |
          patterns=(
            "exc.__class__.__name__"
            "allow_redirects=True"
          )

          found=0

          for pattern in "${patterns[@]}"; do
            matches=$(grep -RIn \
              --include="*.py" \
              --exclude-dir=.git \
              --exclude-dir=.venv \
              --exclude-dir=venv \
              --exclude-dir=env \
              --exclude-dir=__pycache__ \
              --exclude-dir=.ruff_cache \
              "$pattern" . || true)

            if [ -n "$matches" ]; then
              echo "::warning::Found pattern: $pattern"
              echo "$matches"
              found=$((found + 1))
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "✅ No OWASP leak patterns found."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "========== SECURITY SCAN SUMMARY =========="

          if [ "${{ steps.bandit.outcome }}" = "success" ]; then
            echo "Bandit:         ✅ passed"
          else
            echo "Bandit:         ❌ findings or failed"
          fi

          if [ "${{ steps.pipaudit.outcome }}" = "success" ]; then
            echo "pip-audit:      ✅ passed"
          else
            echo "pip-audit:      ⚠ vulnerabilities found"
          fi

          if [ "${{ steps.ruff.outcome }}" = "success" ]; then
            echo "Ruff:           ✅ passed"
          else
            echo "Ruff:           ❌ issues found"
          fi

          echo "Leak patterns:  ✅ checked"
          echo "==========================================="

  mediabot-audit:
    name: Tailored scanner (rules + CVE ingestion)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run media_conversion_bot tailored scanner
        id: mediabot
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python security/scan_mediabot.py --quiet
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "✅ mediabot scanner: clean" ;;
            2) echo "::error::mediabot scanner: confirmed CRITICAL/HIGH findings — see the report artifact" ;;
            3) echo "::warning::mediabot scanner: candidates only — needs manual adjudication" ;;
            *) echo "::error::mediabot scanner failed to run (exit $code)" ;;
          esac
          exit 0

      - name: Coverage summary
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("security/reports/mediabot-audit.json")
          if not p.is_file():
              print("::warning::no audit report produced")
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          sev = d.get("by_severity", {})
          kb = d.get("cve_kb", {})
          conf = d.get("by_verdict", {}).get("CONFIRMED", 0)
          cand = d.get("by_verdict", {}).get("CANDIDATE", 0)
          drift = [r["id"] for r in d.get("coverage", []) if r.get("status") == "catalog-drift"]
          print("=== mediabot audit ===")
          print(f"score: {d.get('score')}/100  findings: {len(d.get('findings', []))} "
                f"(confirmed {conf} / candidates {cand})")
          print(f"severity: " + ", ".join(f"{k}={v}" for k, v in sev.items()))
          print(f"deps resolved: {kb.get('dependency_count', 0)}  advisories: {kb.get('vulnerability_count', 0)}")
          print(f"catalog entries: {len(d.get('coverage', []))}  drift: {drift or 'none'}")
          if drift:
              print(f"::warning::skill catalog references unknown rules: {drift}")
          PY

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mediabot-security-audit
          path: |
            security/reports/mediabot-audit.json
            security/reports/MEDIABOT_SECURITY_AUDIT.md
            security/reports/mediabot-audit.sarif
            security/reports/cve-kb.json
          if-no-files-found: ignore

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
        with:
          sarif_file: security/reports/mediabot-audit.sarif
          category: mediabot-rules

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6  # v3.97.5
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      - name: Report TruffleHog results
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.trufflehog.outcome }}" = "success" ]; then
            echo "✅ No verified secrets detected."
          else
            echo "::warning::TruffleHog detected verified secrets."
            echo "Review the workflow logs and rotate any exposed credentials immediately."
          fi
          