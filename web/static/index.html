<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Convert — تحويل الوسائط</title>
  <link rel="stylesheet" href="static/styles.css">
  <script defer src="static/app.js"></script>
</head>
<body>
  <div class="container">
    <h1>Media Conversion <span dir="rtl" lang="ar">— تحويل الوسائط</span></h1>

    <form id="uploadForm">
      <label class="file-label">
        <input type="file" id="fileInput" name="file" required />
        <span class="file-cta">Choose a file · اختر ملفًا</span>
      </label>
      <div class="token-row">
        <label for="uploadTokenInput">Upload token (optional) · رمز الرفع (اختياري):</label>
        <input type="text" id="uploadTokenInput" name="upload_token" dir="auto" placeholder="Paste upload token if required · الصق رمز الرفع إن لزم" />
      </div>
      <button type="submit" class="btn">Upload &amp; Convert · رفع وتحويل</button>
    </form>

    <!-- dir=auto: an Arabic file/job name displays right-to-left inside the
         otherwise LTR page, and a mixed name keeps its own direction. -->
    <div id="jobs" class="jobs" dir="auto"></div>
  </div>
</body>
</html>
