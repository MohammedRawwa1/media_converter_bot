# Local RabbitMQ + Kafka for the optional event-bus layer (utils/eventbus/).
#
#   docker compose -f docker-compose.eventbus.yml up -d
#   python scripts/check_eventbus.py
#
# Both brokers publish their default ports, so the bot can run on the host (or in
# another compose file) and reach them on localhost. Broker data lives in named
# volumes, so `down` keeps queues and the event log; add `-v` to wipe them.
#
# This file is for development and verification only. In production point
# RABBITMQ_URL / KAFKA_BOOTSTRAP_SERVERS at managed instances (the app code is
# identical either way).
#
# Note: this file is separate from docker-compose.fetcher.yml on purpose - the
# fetcher stack only needs Redis and is deployed on its own.

services:
  rabbitmq:
    # 3.13 is the LTS line; any 3.12+/4.x image works, the topology uses only
    # classic durable queues, publisher confirms and dead-lettering.
    image: rabbitmq:3.13-management
    container_name: media-bot-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP (the bot connects here)
      - "15672:15672"  # management UI: http://localhost:15672 (guest/guest by default)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    # The official Apache image, as documented for KRaft combined mode. "latest"
    # is what the image's own quick start uses; pin a version tag if you want the
    # compose file frozen.
    image: apache/kafka:latest
    container_name: media-bot-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind on all interfaces inside the container (so the published port works)
      # while advertising localhost, which is what a host-side client dials.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # The topic is created on first use; 7 days of history is plenty for a
      # bounded local log and keeps the volume small.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12

  # Optional: browse queues and the event log at http://localhost:8080
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: media-bot-kafka-ui
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #   depends_on:
  #     - kafka

volumes:
  rabbitmq-data:
  kafka-data:
